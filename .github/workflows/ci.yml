name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: this workflow only checks out code and runs checks.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node from package.json engines
        uses: actions/setup-node@v4
        with:
          # Resolves engines.node (>=24.0.0). Node 24 is required for
          # node:sqlite and native TypeScript type stripping.
          node-version-file: package.json
          cache: npm

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
